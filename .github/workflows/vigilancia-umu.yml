name: Vigilancia UMU

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: vigilancia-umu
  cancel-in-progress: false

jobs:
  comprobar-umu:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar lector PDF
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Probar el monitor UMU
        run: python -m unittest tests/test_umu_monitor.py -v

      - name: Revisar fuentes oficiales UMU
        run: python scripts/umu_monitor.py

      - name: Guardar estado y detecciones
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi

          git config user.name "observatorio-normativo-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/monitor/umu_state.json data/novedades/umu.json
          git commit -m "chore: vigilancia automática UMU"
          git push
