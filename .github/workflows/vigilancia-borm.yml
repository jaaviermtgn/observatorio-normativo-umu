name: Vigilancia BORM

on:
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-6"
      timezone: "Europe/Madrid"

permissions:
  contents: write

concurrency:
  group: vigilancia-borm
  cancel-in-progress: false

jobs:
  comprobar-borm:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Instalar lector PDF
        run: python -m pip install --disable-pip-version-check pypdf

      - name: Probar el monitor BORM
        run: python -m unittest tests/test_borm_monitor.py -v

      - name: Revisar nuevos boletines del BORM
        run: python scripts/borm_monitor.py

      - name: Guardar estado y novedades
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No hay cambios que guardar."
            exit 0
          fi

          git config user.name "observatorio-normativo-bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/monitor/borm_state.json data/novedades/borm.json
          git commit -m "chore: vigilancia automática BORM"
          git push
